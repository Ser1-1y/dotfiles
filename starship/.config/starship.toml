"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#1e2127)\
$username\
[](bg:#1793D1 fg:#1e2127)\
$directory\
[](fg:#1793D1 bg:#1f6feb)\
$git_branch\
$git_status\
[](fg:#1f6feb bg:#3b82f6)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#3b82f6 bg:#0ea5e9)\
$docker_context\
[](fg:#0ea5e9 bg:#111827)\
$time\
[ ](fg:#111827)\
"""

[username]
show_always = true
style_user = "bg:#1e2127 fg:#ffffff"
style_root = "bg:#1e2127 fg:#ffffff"
format = '[$user ]($style)'
disabled = false

[directory]
style = "bg:#1793D1 fg:#ffffff"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ]($style)'

[cpp]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#0ea5e9 fg:#ffffff"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#1f6feb fg:#ffffff"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#1f6feb fg:#ffffff"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#3b82f6 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:#111827 fg:#ffffff"
format = '[ ♥ $time ]($style)'
