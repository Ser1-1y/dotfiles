font_family FiraCode Nerd Font

disable_ligatures never

cursor_trail 300

color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2

color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# ─────────────────────────────
# CURSOR
# ─────────────────────────────
cursor_shape beam
cursor_blink yes

# ─────────────────────────────
# SCROLLBACK
# ─────────────────────────────
scrollback_lines 100000

# ─────────────────────────────
# WINDOW SETTINGS
# ─────────────────────────────
window_padding_width 10
background_opacity 0.8
enable_audio_bell no

# ─────────────────────────────
# TABS
# ─────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# ─────────────────────────────
# SHORTCUTS
# ─────────────────────────────
map ctrl+shift+t new_tab
map ctrl+shift+enter new_window
map ctrl+shift+w close_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab

# ─────────────────────────────
# SHELL
# ─────────────────────────────
shell /usr/bin/fish
